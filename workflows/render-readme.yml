name: Render README.Rmd to README.md

on:
  push:
    paths:
      - '../README.Rmd'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  render-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install R Dependencies
        run: |
          install.packages(c("rmarkdown", "knitr", "dplyr", "ggplot2", "tidyr", "lubridate", "igraph"))
        shell: Rscript {0}

      - name: Render README.Rmd
        run: |
          Rscript -e 'rmarkdown::render("README.Rmd", output_format = "github_document", output_file = "README.md")'
        shell: bash

      - name: Commit and Push Rendered README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🌌 Auto-render README.md from README.Rmd [skip ci]"
          file_pattern: "README.md images/"